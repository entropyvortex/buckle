name: Claude Corp
description: Node + Claude Code + Grok Build + GitHub CLI + MCP servers. Per-workspace agent state.
version: 0.1.0

# Reference template: extends the built-in `node` template, then layers
# Claude Code, Grok Build, GitHub CLI, git signing, and two MCP servers.
#
# Patterns shown:
# - `extends` for reuse
# - `features` sugar (claude-code, grok, gh, git-config, mcp:*)
# - buckle:workspace/* mount sentinels, resolved at generate time
#   (never host ~/.claude / ~/.grok)

extends: node

features:
  - claude-code
  - grok
  - gh
  - git-config
  - mcp:filesystem
  - mcp:sequential-thinking

env:
  CLAUDE_CONFIG_DIR: /home/vscode/.claude

# Per-workspace agent state: resolved to
# $XDG_DATA_HOME/buckle/workspaces/<id>/{claude,grok} (default) or host
# ~/.claude / ~/.grok with --share-home.
mounts:
  - source: buckle:workspace/claude
    target: /home/vscode/.claude
    type: bind
  - source: buckle:workspace/grok
    target: /home/vscode/.grok
    type: bind

customizations:
  vscode:
    extensions:
      - anthropic.claude-code
