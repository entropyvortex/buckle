name: AI Native
description: Claude Code + Grok Build with common MCP servers. Agents run with permission prompts disabled; per-workspace state.
version: 0.1.0

# Dual-agent starting point: Claude Code and Grok Build installed side by side,
# each with a persistent per-workspace state mount.
#
# Usage:
#   buckle up ai-native
#   buckle new myproject --extend ai-native   # editable copy
#
# Extend it for your stack (node, python, …).

extends: ubuntu-base

features:
  - node
  - gh
  - git-config
  - mcp:filesystem
  - mcp:github
  - mcp:sequential-thinking
  # claude-code and grok are not listed as features: this template declares the
  # mounts, CLAUDE_CONFIG_DIR, and install + alias steps itself (!replace +
  # user: vscode) to avoid duplicate installer runs from the feature patches.

env:
  CLAUDE_CONFIG_DIR: /home/vscode/.claude
  # Grok Build reads ~/.grok/auth.json

# Per-workspace agent state. `buckle:workspace/*` is resolved at generate time;
# copying this YAML cannot bind the developer's ~/.claude or ~/.grok.
mounts:
  - source: buckle:workspace/claude
    target: /home/vscode/.claude
    type: bind
  - source: buckle:workspace/grok
    target: /home/vscode/.grok
    type: bind

customizations:
  vscode:
    extensions:
      - anthropic.claude-code
      # Grok Build is terminal-only (grok / agent commands); no VS Code extension.

# Agent setup runs as the vscode user so state lands in the mounted homes.
# The aliases disable the agents' permission prompts: this container is a
# disposable sandbox and source is only bind-mounted in. Remove the aliases in
# an extending template if you want prompting back (see README trust model).
lifecycle:
  postCreate:
    - "!replace"
    - command: "curl -fsSL https://claude.ai/install.sh | bash"
      user: "vscode"
    - command: "curl -fsSL https://x.ai/cli/install.sh | bash"
      user: "vscode"
    - command: |
        echo 'alias grok="grok --yolo"' >> ~/.zshrc
        echo 'alias grok="grok --yolo"' >> ~/.bashrc
        echo 'alias claude="claude --dangerously-skip-permissions"' >> ~/.zshrc
        echo 'alias claude="claude --dangerously-skip-permissions"' >> ~/.bashrc
      user: "vscode"
